
name: MOTIONSTORY AI - Render Video

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "ID project MOTIONSTORY AI"
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil repository
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Siapkan FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Pasang Pillow
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Render video MOTIONSTORY AI
        env:
          API_TOKEN: ${{ secrets.MOTIONSTORY_API_TOKEN }}
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          python render.py

      - name: Simpan hasil video
        uses: actions/upload-artifact@v4
        with:
          name: motionstory-video
          path: motionstory-output.mp4
          if-no-files-found: error
          retention-days: 7
